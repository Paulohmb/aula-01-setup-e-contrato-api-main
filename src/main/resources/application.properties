# ============================================================
# Configurações da Aplicação - SA "Não Esqueci"
# Aula 01: Setup Inicial e Configurações de Ambiente
# ============================================================

# Nome da Aplicação no ecossistema Spring
spring.application.name=gi-esquece-api

# Porta padrão de execução do servidor Tomcat embarcado
server.port=8080

# Formato e Fuso Horário padrão para serialização de datas com Jackson
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# Configuração do Banco de Dados (H2 em modo PostgreSQL)
spring.datasource.url=jdbc:h2:mem:naoesquece_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate e Validação de Schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
